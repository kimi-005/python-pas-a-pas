/* Layout: sticky top bar, lesson list on the left, one lesson per page on the right.
   The lesson header is ruled like a French Seyès exercise book (2 mm lines, 8 mm squares, red margin). */
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --ink: #131a30;
  --ink-2: #4a546d;
  --ink-3: #7a8399;

  --rule-strong: rgba(64, 108, 210, 0.26);
  --ok: #17784c;
  --ok-soft: #e2f3e9;
  --warn: #9a5800;
  --warn-soft: #fcf0d9;
  --bad: #c0362d;
  --bad-soft: #fbe6e4;
  --code-bg: #f2f4f9;
  --code-ink: #18203b;
  --tok-kw: #1f47c2;
  --tok-str: #17784c;
  --tok-num: #b23a1f;
  --tok-com: #7a8399;
  --tok-def: #7a3fb8;
  --tok-builtin: #0d6c80;
  --select: #d6e0fb;
  --trace: #fff1c2;
  --plot-1: #2a78d6;
  --plot-2: #eb6834;
  --plot-3: #1baf7a;
  --plot-4: #eda100;
  --plot-5: #e87ba4;
  --plot-6: #008300;
  --plot-7: #6250d6;
  --plot-8: #e34948;
  --shadow: 0 1px 2px rgba(19, 26, 48, 0.06), 0 4px 16px rgba(19, 26, 48, 0.05);

  --f-display: "Bricolage Grotesque", "Atkinson Hyperlegible Next", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --step--1: 0.875rem;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: clamp(1.9rem, 1.4rem + 2vw, 2.6rem);

}

  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--step-0);
  line-height: 1.55;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--surface);
}
a { color: var(--accent); }
code, kbd, pre { font-family: var(--f-mono); }
p code, li code, td code, .note code, .prompt code, .intro code, .caption code, .hint-box code, .after code, .item-note code, .help code {
  font-size: 0.92em;
  background: var(--code-bg);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 0.05em 0.35em;
  white-space: nowrap;
}
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.55; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-inner {
  min-height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 12px 16px;
  flex-wrap: wrap;
  padding-block: 8px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--ink);
  min-width: 0;
}
.brand-mark {
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--accent-ink);
  background: var(--accent);
  border-radius: 7px;
  padding: 3px 7px;
  letter-spacing: -0.02em;
}
.brand-name {
  font-family: var(--f-display);
  font-weight: 800;
  font-size: 1.2rem;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.topbar-tools { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.py-status {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: var(--step--1);
  color: var(--ink-2);
  white-space: nowrap;
}
.py-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); flex: none; }
.py-status[data-state="loading"] .py-dot, .py-status[data-state="restarting"] .py-dot { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
.py-status[data-state="ready"] .py-dot { background: var(--ok); }
.py-status[data-state="error"] .py-dot { background: var(--bad); }
@keyframes pulse { 50% { opacity: 0.3; } }
.lang {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.lang button {
  border: 0;
  background: transparent;
  padding: 5px 11px;
  font-weight: 700;
  font-size: var(--step--1);
  letter-spacing: 0.04em;
  color: var(--ink-2);
}
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* ---------- layout ---------- */
.layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  align-items: start;
  max-width: 1180px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  gap: 40px;
}
.side {
  position: sticky;
  top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px));
  max-height: calc(100vh - var(--topbar-h) - env(safe-area-inset-top, 0px));
  overflow-y: auto;
  padding-block: 28px 32px;
}
.track { display: grid; gap: 4px; margin-bottom: 22px; }
.track-title {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  font-weight: 700;
  color: var(--ink-3);
  margin: 0 0 6px 10px;
}
.lesson-link {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: 9px;
  text-decoration: none;
  color: var(--ink);
  font-size: 0.97rem;
  line-height: 1.3;
}
.lesson-link:hover { background: var(--accent-soft); }
.lesson-link[aria-current="page"] { background: var(--surface); box-shadow: var(--shadow); font-weight: 700; }
.lesson-link.is-soon { color: var(--ink-3); pointer-events: none; }
.ring { width: 34px; height: 34px; position: relative; flex: none; }
.ring svg { width: 34px; height: 34px; transform: rotate(-90deg); }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); transition: stroke-dashoffset 0.4s ease; }
.ring.is-done .fg { stroke: var(--ok); }
.ring span {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-size: 0.8rem; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.ring.is-done span { color: var(--ok); }
.lesson-count { font-size: 0.78rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.soon-tag { font-size: 0.72rem; color: var(--ink-3); border: 1px dashed var(--line); border-radius: 99px; padding: 1px 7px; }
.side-foot { padding: 10px; display: grid; gap: 8px; font-size: var(--step--1); color: var(--ink-3); }
.linkish {
  background: none; border: 0; padding: 0; text-align: left;
  color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px;
  font-size: var(--step--1);
}
.linkish.is-armed { color: var(--bad); font-weight: 700; }

/* ---------- lesson ---------- */
main { min-width: 0; padding-block: 28px 80px; }
.lesson { max-width: 780px; display: grid; gap: 22px; }
.lesson-head {
  --mx: 44px;
  position: relative;
  background-color: var(--surface);
  background-image:
    linear-gradient(90deg, transparent calc(var(--mx) - 2px), var(--margin-red) calc(var(--mx) - 2px), var(--margin-red) var(--mx), transparent var(--mx)),
    linear-gradient(var(--rule-strong) 1px, transparent 1px),
    linear-gradient(90deg, var(--rule-strong) 1px, transparent 1px),
    linear-gradient(var(--rule-fine) 1px, transparent 1px);
  background-size: 100% 100%, 100% 32px, 32px 100%, 100% 8px;
  background-position: 0 0, 0 15px, var(--mx) 0, 0 7px;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 26px 24px 24px calc(var(--mx) + 22px);
  display: grid;
  gap: 10px;
  box-shadow: var(--shadow);
}
.eyebrow {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 700;
  color: var(--accent);
  margin: 0;
}
h1 {
  font-family: var(--f-display);
  font-weight: 800;
  font-size: var(--step-3);
  line-height: 1.08;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
.intro { margin: 0; font-size: var(--step-1); line-height: 1.5; color: var(--ink-2); max-width: 62ch; }
.progress { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; font-size: var(--step--1); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar { flex: 1 1 160px; max-width: 260px; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s ease; }
.bar.is-done > i { background: var(--ok); }
.done-chip { color: var(--ok); font-weight: 700; }

.section-title {
  display: flex; align-items: baseline; gap: 12px;
  font-family: var(--f-display);
  font-weight: 800;
  font-size: var(--step-2);
  letter-spacing: -0.01em;
  margin: 18px 0 0;
  padding-top: 18px;
  border-top: 2px solid var(--ink);
}
.section-title small { font-family: var(--f-body); font-weight: 400; font-size: var(--step--1); color: var(--ink-3); }
h2.block-h {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: var(--step-1);
  margin: 14px 0 -6px;
  letter-spacing: -0.005em;
  text-wrap: balance;
}
.lesson p { margin: 0; max-width: 68ch; }
.note {
  background: var(--accent-soft);
  border-radius: var(--radius);
  padding: 14px 16px;
  max-width: 68ch;
}
.note p { margin: 0; }

/* tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.97rem; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); font-weight: 700; background: var(--code-bg); }
td.mono { font-family: var(--f-mono); white-space: nowrap; color: var(--code-ink); }

/* algorithm vs python */
.compare { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 14px; align-items: start; }
.compare .caption { grid-column: 1 / -1; margin: 0; color: var(--ink-2); max-width: 68ch; }
.algo {
  border: 1.5px solid var(--ink);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 10px 14px 12px;
  min-width: 0;
}
.algo-label, .py-label {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; color: var(--ink-3);
  margin-bottom: 6px;
}
.algo pre {
  margin: 0;
  font-family: var(--f-body);
  font-size: 1rem;
  line-height: 1.6;
  white-space: pre;
  overflow-x: auto;
  font-style: italic;
}
.algo pre b { font-style: normal; font-weight: 700; }

/* euclidean division & list index visuals */
.division {
  display: inline-grid;
  grid-template-columns: auto auto;
  font-family: var(--f-mono);
  font-size: 1.35rem;
  line-height: 1.4;
  justify-self: start;
  margin-left: 6px;
}
.division span { padding: 2px 14px; }
.division .dv { border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
.division .q { border-left: 2px solid var(--ink); color: var(--accent); font-weight: 600; }
.division .r { color: var(--margin-red); font-weight: 600; }
.index-viz { overflow-x: auto; padding-bottom: 4px; }
.index-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(74px, auto); gap: 6px; width: max-content; }
.index-row .cell {
  border: 1.5px solid var(--ink);
  border-radius: 8px;
  padding: 10px 12px;
  font-family: var(--f-mono);
  text-align: center;
  background: var(--surface);
  white-space: nowrap;
}
.index-row .ix { text-align: center; font-family: var(--f-mono); font-size: 0.85rem; color: var(--accent); font-weight: 600; }
.index-row .ix.neg { color: var(--margin-red); }

/* anatomy */
.anatomy { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.anatomy ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.anatomy li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline; }
.anatomy li code { white-space: nowrap; }

/* ---------- code widgets ---------- */
.codebox {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--code-bg);
  overflow: hidden;
  min-width: 0;
}
.codebox .CodeMirror {
  height: auto;
  font-family: var(--f-mono);
  font-size: 0.98rem;
  line-height: 1.55;
  background: var(--code-bg);
  color: var(--code-ink);
  padding: 6px 0;
}
.codebox .CodeMirror-gutters { background: var(--code-bg); border-right: 1px solid var(--line); }
.codebox .CodeMirror-linenumber { color: var(--ink-3); padding: 0 8px 0 6px; min-width: 18px; }
.codebox .CodeMirror-cursor { border-left: 2px solid var(--accent); }
.codebox .CodeMirror-selected, .codebox .CodeMirror-focused .CodeMirror-selected { background: var(--select); }
.codebox .CodeMirror-line::selection, .codebox .CodeMirror-line > span::selection, .codebox .CodeMirror-line > span > span::selection { background: var(--select); }
.codebox .CodeMirror-matchingbracket { color: var(--ok) !important; font-weight: 700; }
.cm-s-pp .cm-keyword { color: var(--tok-kw); font-weight: 600; }
.cm-s-pp .cm-string { color: var(--tok-str); }
.cm-s-pp .cm-number { color: var(--tok-num); }
.cm-s-pp .cm-comment { color: var(--tok-com); font-style: italic; }
.cm-s-pp .cm-def { color: var(--tok-def); font-weight: 600; }
.cm-s-pp .cm-builtin { color: var(--tok-builtin); }
.cm-s-pp .cm-variable, .cm-s-pp .cm-variable-2, .cm-s-pp .cm-property { color: var(--code-ink); }
.cm-s-pp .cm-operator, .cm-s-pp .cm-punctuation, .cm-s-pp .cm-bracket { color: var(--ink-2); }
.cm-s-pp .cm-error { color: var(--bad); background: transparent; }
.cm-s-pp .cm-meta { color: var(--tok-def); }
.codebox textarea.plain {
  display: block; width: 100%; min-height: 6.5em; border: 0; resize: vertical;
  background: var(--code-bg); color: var(--code-ink);
  font-family: var(--f-mono); font-size: 0.98rem; line-height: 1.55; padding: 10px 14px;
  tab-size: 4;
}
.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 8px 10px;
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.toolbar .spacer { flex: 1; }
.kbd-tip { font-size: 0.78rem; color: var(--ink-3); }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 6px 12px;
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.3;
  color: var(--ink);
}
.btn:hover { border-color: var(--ink-3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
.btn-ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn-ok:hover { filter: brightness(1.08); border-color: var(--ok); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn-ghost:hover { border-color: var(--line); }
.btn svg { width: 14px; height: 14px; flex: none; }
.output {
  border-top: 1px solid var(--line);
  background: var(--surface);
  padding: 10px 14px 12px;
  display: grid; gap: 8px;
}
.output-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; color: var(--ink-3); }
.output-label .ran-with { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 0.85rem; font-family: var(--f-mono); }
.output pre {
  margin: 0; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word;
  max-height: 320px; overflow: auto; color: var(--code-ink);
}
.output .muted { color: var(--ink-3); font-style: italic; }
.err {
  border-radius: 8px;
  background: var(--bad-soft);
  padding: 10px 12px;
  display: grid; gap: 4px;
}
.err strong { color: var(--bad); }
.err code { font-size: 0.9rem; word-break: break-word; }
.err p { margin: 0; font-size: 0.95rem; }

/* ---------- charts ---------- */
.plot { margin: 4px 0 0; display: grid; gap: 6px; }
.plot-svg { position: relative; overflow-x: auto; }
.plot-svg svg { display: block; max-width: 100%; height: auto; font-family: var(--f-body); touch-action: pan-y; }
.plot-svg .tk { font-size: 11.5px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.plot-svg .al { font-size: 12.5px; fill: var(--ink-2); }
.plot-svg .tt { font-size: 14px; font-weight: 700; fill: var(--ink); }
.plot-svg .lg { font-size: 12px; fill: var(--ink-2); }
.plot-tip {
  position: absolute; transform: translate(-50%, calc(-100% - 12px));
  background: var(--ink); color: var(--surface);
  font-family: var(--f-mono); font-size: 0.8rem; white-space: nowrap;
  padding: 4px 8px; border-radius: 6px; pointer-events: none;
}
.plot-data summary { cursor: pointer; font-size: 0.85rem; color: var(--ink-2); }
.plot-data .table-wrap { margin-top: 8px; max-height: 240px; overflow: auto; }
.plot-data caption { text-align: left; font-size: 0.8rem; color: var(--ink-3); padding: 6px 12px; }
.plot-data td { font-family: var(--f-mono); font-variant-numeric: tabular-nums; padding: 4px 12px; }

/* ---------- défis & problem steps ---------- */
.section-title.is-defis { border-top-color: var(--margin-red); scroll-margin-top: calc(var(--topbar-h) + 16px); }
.exercise.is-defi .ex-kind { color: var(--margin-red); }
.exercise.is-defi { border-color: color-mix(in srgb, var(--margin-red) 35%, var(--line)); }
.exercise.is-step .ex-kind { color: var(--accent); }
.exercise.is-locked { border-style: dashed; background: transparent; }
.exercise.is-locked .ex-title { color: var(--ink-3); }
.hint-box { display: grid; gap: 8px; }
.progress a.chip { text-decoration: none; }

/* ---------- step-by-step tracer ---------- */
.CodeMirror .cm-trace-line { background: var(--trace); }
.fillcode .fl.is-trace { background: var(--trace); }
.trace {
  border-top: 1px solid var(--line);
  background: var(--surface);
  padding: 10px 14px 14px;
  display: grid; gap: 10px;
  outline: none;
}
.trace-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.trace-close { padding: 3px 10px; }
.trace-ctrl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.trace-count { margin-left: auto; font-size: 0.85rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.trace-range { width: 100%; accent-color: var(--accent); }
.trace-msg { margin: 0; font-weight: 600; }
.trace-table { max-height: 260px; overflow: auto; }
.trace-table table { font-size: 0.9rem; }
.trace-table th { position: sticky; top: 0; z-index: 1; text-transform: none; letter-spacing: 0; font-family: var(--f-mono); font-size: 0.85rem; color: var(--ink-2); }
.trace-table td { font-family: var(--f-mono); white-space: nowrap; padding: 5px 12px; font-variant-numeric: tabular-nums; }
.trace-table td:first-child, .trace-table td:nth-child(2) { color: var(--ink-3); }
.trace-table td.chg { color: var(--accent); font-weight: 700; }
.trace-table tr.is-cur td { background: var(--accent-soft); }
.trace-out { margin: 0; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; color: var(--code-ink); }
.trace-out.muted { color: var(--ink-3); font-style: italic; }

/* ---------- fill-in-the-blanks ---------- */
.fillcode {
  margin: 0; padding: 12px 14px;
  font-family: var(--f-mono); font-size: 0.98rem; line-height: 1.9;
  color: var(--code-ink); background: var(--code-bg);
  overflow-x: auto; white-space: pre;
}
.fillcode .fl { display: inline; border-radius: 4px; }
.fillcode input.blank {
  font: inherit; color: var(--ink);
  background: var(--surface);
  border: 0; border-bottom: 2px dashed var(--accent);
  border-radius: 4px 4px 0 0;
  padding: 0 4px; margin: 0 1px;
  min-width: 6ch;
}
.fillcode input.blank:focus { outline: none; border-bottom-style: solid; box-shadow: 0 0 0 3px var(--accent-soft); }

/* ---------- révisions ---------- */
.side-tools { display: grid; gap: 4px; margin-bottom: 18px; }
.side-tool {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-radius: 9px;
  text-decoration: none; color: var(--ink); font-weight: 600;
  border: 1px solid var(--line); background: var(--surface);
}
.side-tool:hover { border-color: var(--accent); }
.side-tool[aria-current="page"] { border-color: var(--accent); background: var(--accent-soft); }
.side-tool-icon { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); }
.side-tool-icon svg { width: 13px; height: 13px; }
.rev-card .rev-from { font-size: var(--step-0); color: var(--ink-2); text-decoration: none; }
.rev-card .rev-from:hover { color: var(--accent); }
.rev-card .pitem { max-width: 560px; }
a.btn { text-decoration: none; }

/* ---------- mémo drawer ---------- */
.memo-btn svg { width: 15px; height: 15px; }
.memo-btn[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.memo {
  position: fixed; right: 0; bottom: 0; top: 0;
  width: min(460px, 100%);
  z-index: 25;
  background: var(--surface);
  border-left: 1px solid var(--line);
  box-shadow: -8px 0 32px rgba(0, 0, 0, 0.12);
  overflow-y: auto;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 18px;
  display: grid; align-content: start; gap: 12px;
}
.memo-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.memo-head h2 { margin: 0; font-family: var(--f-display); font-size: var(--step-1); }
.memo-search {
  width: 100%; font: inherit; padding: 8px 12px; border-radius: 9px;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--ink);
  position: sticky; top: -16px; z-index: 1;
}
.memo-search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.memo-list { display: grid; gap: 18px; }
.memo-sec { display: grid; gap: 8px; }
.memo-sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.memo-sec-head h3 { margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.memo-sec-head a { font-size: 0.82rem; }
.memo-row { display: grid; gap: 3px; }
.memo-row pre {
  margin: 0; padding: 6px 10px; border-radius: 7px;
  background: var(--code-bg); color: var(--code-ink);
  font-size: 0.9rem; overflow-x: auto;
}
.memo-row p { margin: 0 0 0 2px; font-size: 0.9rem; color: var(--ink-2); }
.memo-row.is-error pre { box-shadow: inset 3px 0 0 var(--bad); }
.memo-err { color: var(--bad); }

/* ---------- phone key bar ---------- */
.keybar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; gap: 6px; overflow-x: auto;
  background: var(--surface);
  border-top: 1px solid var(--line);
  box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.08);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));

}
.keybar .key {

}

.py-alert.loading { display: grid; gap: 8px; }
.py-alert .bar { max-width: none; }

/* ---------- shared lessons, editor, library ---------- */
.field { display: grid; gap: 5px; }
.field-label { font-weight: 600; font-size: 0.93rem; }
.atelier input[type="text"], .atelier textarea, .atelier select, textarea.code-in, textarea.code-out {

}

.atelier input:focus, .atelier textarea:focus, .atelier select:focus, textarea.code-in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.atelier-card { gap: 12px; }

.mini {

}

.mini-del.is-armed, .linkish.is-armed { color: var(--bad); border-color: var(--bad); }
.add-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.test-rows { display: grid; gap: 6px; }
.test-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; align-items: center; }

.item-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: start; }

.atelier-report { display: grid; gap: 6px; }

.btn.is-disabled { opacity: 0.5; pointer-events: none; }
.copy-box { display: grid; gap: 8px; }
.copy-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.share-sec { border-style: dashed; }
.short-code { margin: 0; font-size: 1.05rem; }

.shared-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.shared-list li {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
}
.shared-title { font-weight: 700; text-decoration: none; color: var(--ink); }
.shared-title:hover { color: var(--accent); }
.shared-list .chip { margin-left: auto; letter-spacing: 0.1em; }
.mono { font-family: var(--f-mono); }
.preview-banner a { font-weight: 700; }
.lib-body { display: grid; gap: 12px; }

/* ---------- exercises ---------- */
.exercise {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px 18px 18px;

  gap: 14px;

}
.ex-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

}

.predict-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }

}
.pitem pre.pcode .pp-prompt { color: var(--ink-3); user-select: none; }
.panswer { padding: 10px 12px; display: grid; gap: 8px; border-top: 1px solid var(--line); }
.panswer-row { display: flex; gap: 8px; align-items: center; }
.panswer input {
  flex: 1 1 auto; min-width: 0;
  font-family: var(--f-mono); font-size: 0.98rem;
  padding: 7px 10px;
  border-radius: 8px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}
.panswer input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.pitem[data-state="ok"] { border-color: var(--ok); }
.pitem[data-state="ok"] input { border-color: var(--ok); background: var(--ok-soft); }
.pitem[data-state="almost"] input { border-color: var(--warn); }
.pitem[data-state="wrong"] input { border-color: var(--bad); }
.verdict { font-size: 0.93rem; display: grid; gap: 4px; }
.verdict .v-ok { color: var(--ok); font-weight: 700; }
.verdict .v-almost { color: var(--warn); font-weight: 700; }
.verdict .v-wrong { color: var(--bad); font-weight: 700; }
.verdict pre { margin: 0; font-size: 0.92rem; white-space: pre-wrap; word-break: break-word; color: var(--code-ink); background: var(--code-bg); border-radius: 6px; padding: 6px 9px; }
.item-note { color: var(--ink-2); font-size: 0.92rem; }

.tests { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.tests li {
  display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start;
  font-size: 0.93rem; padding: 7px 10px; border-radius: 8px; background: var(--code-bg);
}
.tests li .t-icon { font-weight: 700; color: var(--ink-3); text-align: center; }
.tests li.ok { background: var(--ok-soft); }
.tests li.ok .t-icon { color: var(--ok); }
.tests li.bad { background: var(--bad-soft); }
.tests li.bad .t-icon { color: var(--bad); }
.tests code { font-size: 0.9rem; white-space: pre-wrap; word-break: break-word; }
.t-detail { color: var(--ink-2); display: block; margin-top: 2px; }
.banner { border-radius: 10px; padding: 10px 14px; font-weight: 600; }
.banner.ok { background: var(--ok-soft); color: var(--ok); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.info { background: var(--warn-soft); color: var(--warn); }
.hint-box { border-radius: 10px; background: var(--warn-soft); padding: 10px 14px; }
.hint-box p { margin: 0; }
.after { color: var(--ink-2); margin: 0; }

.lesson-nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
.lesson-nav a {
  display: grid; gap: 2px;
  text-decoration: none;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 12px;
  padding: 10px 16px;
  color: var(--ink);
  max-width: 100%;
}
.lesson-nav a small { color: var(--ink-3); font-size: 0.8rem; }
.lesson-nav a.next { margin-left: auto; text-align: right; }
.lesson-nav a:hover { border-color: var(--accent); }

.py-alert { border-radius: 12px; padding: 12px 16px; background: var(--bad-soft); color: var(--ink); }
.py-alert.loading { background: var(--accent-soft); }

/* ---------- narrow screens ---------- */
@media (max-width: 920px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .side {
    position: static; max-height: none; overflow: visible;
    padding-block: 14px 0;
    display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  }
  .track, .track-list { display: contents; }
  .track-title, .is-soon, .ll-title, .lesson-count, .side-foot { display: none; }
  .side-tools { flex-basis: 100%; margin-bottom: 4px; display: flex; flex-wrap: wrap; gap: 6px; }
  .side-tools .side-tool { flex: 1 1 auto; }
  .test-row { grid-template-columns: minmax(0, 1fr) auto; }
  .test-row select { grid-column: 1 / -1; }
  .side-tool { padding: 6px 10px; }
  .lesson-link {
    display: block; padding: 2px; border-radius: 99px;
    border: 2px solid transparent; background: transparent; box-shadow: none;
  }
  .lesson-link[aria-current="page"] { border-color: var(--accent); background: var(--surface); box-shadow: none; }
  .lesson-link.is-soon { display: none; }
  .ring { display: block; }
  .ring, .ring svg { width: 32px; height: 32px; }
  main { padding-block: 14px 64px; }
  .compare, .anatomy { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .lesson-head { --mx: 26px; padding: 20px 16px 18px calc(var(--mx) + 14px); }
  .brand-name { font-size: 1.05rem; }
  .py-status .py-text { display: none; }
  .memo-btn { padding: 6px 9px; }
  .memo-btn #memo-btn-text { display: none; }
  .topbar-tools { gap: 8px; }
  .exercise { padding: 14px 12px; }
  .kbd-tip { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

  function renderAlgo(text) {

        pre.appendChild(h("b", { text: m[2] }));
        pre.appendChild(document.createTextNode(line.slice(m[0].length)));
      } else pre.appendChild(document.createTextNode(line));

    return pre;

  function codeRunner(code, opts) {

  /* ================= predict exercises ================= */
  function normAns(s) { return String(s).replace(/\s+/g, "").replace(/"/g, "'"); }
  function isNum(s) { return /^-?\d+(\.\d+)?(e-?\d+)?$/i.test(s); }
  function judge(answer, res) {
    res = normalizeResult(res);
    var raw = String(answer || "").trim();
    if (!raw) return { status: "empty" };
    if (res.error) {
      var a = raw.toLowerCase();
      var type = (res.error.type || "").toLowerCase();
      if (/^(erreur|error|err|bug|x|impossible)\b/.test(a) || (type && a.indexOf(type) !== -1) || a.indexOf("error") !== -1 || a.indexOf("erreur") !== -1) return { status: "ok" };
      return { status: "wrong" };
    }
    var actual = (res.out || "").replace(/\s+$/, "");
    var A = normAns(raw), B = normAns(actual);
    if (A === B) return { status: "ok" };
    if (B === "" && /^(rien|nothing|vide|empty|aucun|aucunechose|-|∅)$/.test(A.toLowerCase())) return { status: "ok" };
    var m = B.match(/^<class'(\w+)'>$/);
    if (m && (A === m[1] || A === "'" + m[1] + "'")) return { status: "ok" };
    if (A.length >= 2 && A[0] === "'" && A[A.length - 1] === "'" && A.slice(1, -1) === B) return { status: "ok" };
    if (B.length >= 2 && B[0] === "'" && B[B.length - 1] === "'" && B.slice(1, -1) === A) return { status: "almost", why: "quotes" };
    if (isNum(A) && isNum(B) && parseFloat(A) === parseFloat(B)) return { status: "almost", why: B.indexOf(".") !== -1 ? "toFloat" : "toInt" };
    if (/^-?\d+,\d+$/.test(A) && A.replace(",", ".") === B) return { status: "almost", why: "comma" };
    var al = A.toLowerCase();
    if ((B === "True" && ["t", "v", "vrai", "true", "oui", "yes"].indexOf(al) !== -1) || (B === "False" && ["f", "faux", "false", "non", "no"].indexOf(al) !== -1)) return { status: "almost", why: "bool" };
    if (al === B.toLowerCase()) return { status: "almost", why: "kase" };
    return { status: "wrong" };
  }

  function verifyDraft() {
    var d = draftObj();
    var report = { global: [], ex: [] };
    if (!(d.title || "").trim()) report.global.push(t("errNoTitle"));
    var hasBlock = d.blocks.some(function (b) { return ((b.t === "code" ? b.code : b.text) || "").trim(); });
    if (!hasBlock && !d.exercises.length) report.global.push(t("errEmpty"));

    d.exercises.forEach(function (ex, i) {
      var r = { problems: [], warnings: [], items: [], tests: [] };
      report.ex[i] = r;
      if (ex.t === "predict") {
        var items = ex.items.filter(function (it) { return (it.code || "").trim(); });
        if (!items.length) r.problems.push(t("errNoItems"));
        ex.items.forEach(function (it, j) {
          if (!(it.code || "").trim()) return;
          chain = chain.then(function () { return Py.call({ kind: "run", code: it.code, setup: ex.setup || "" }); }).then(function (res) {
            res = normalizeResult(res);
            if (res.error && (res.error.type === "TimeLimit" || res.error.type === "Untrusted")) { r.problems.push(errText(res.error)); r.items[j] = { text: "→ " + errText(res.error), bad: true }; return; }

      if (!ex.tests.length) r.problems.push(t("errNoTests"));
      if (ex.tests.some(function (tt) { return !(tt.input || "").trim(); })) r.problems.push(t("errEmptyTest"));
      if (r.problems.length) return;
      var sol = ex.t === "code" ? (ex.solution || "") : fillSolution(ex.template || "");
      var start = ex.t === "code" ? (ex.starter || "") : fillEmpty(ex.template || "");
      var payload = ex.tests.map(function (tt) { return tt.kind === "setup" ? { setup: tt.input } : { call: tt.input }; });
      chain = chain.then(function () { return Py.call({ kind: "expect", code: sol, tests: payload }); }).then(function (res) {

        if (res.syntax) { r.problems.push(t("errSolution") + errText(res.syntax)); return; }

            if (!row.stdout.trim()) r.warnings.push(fmt(t("warnNoOutput"), { c: tt.input }));
            r.tests[k] = { text: "→ " + t("shouldPrint") + " " + (row.stdout.replace(/\n$/, "").replace(/\n/g, " ⏎ ") || t("noOutput")) };
          } else {

        var built = ex.tests.map(function (tt) { return tt.kind === "setup" ? { setup: tt.input, call: "", expect: "", stdout: tt.stdout } : { setup: "", call: tt.input, expect: tt.expect, stdout: "" }; });

    startPage(true);
    var art = h("article", { class: "lesson" });
    art.appendChild(pageHead(t("shared"), t("libTitle"), t("libIntro")));
    var body = h("div", { class: "lib-body" }, h("p", { class: "help", text: t("opening") }));
    art.appendChild(body);
    mainEl.appendChild(art);
    var myRoute = window.location.hash;
    Promise.all([getCap("db"), getCap("user")]).then(function (caps) {
      if (window.location.hash !== myRoute) return;
      var db = caps[0], user = caps[1];
      body.innerHTML = "";
      if (!db) { body.appendChild(h("div", { class: "banner info", text: t("libUnavailable") })); return; }
      var search = h("input", { type: "search", class: "memo-search", placeholder: t("libSearch"), "aria-label": t("libSearch") });
      var list = h("ul", { class: "shared-list" });
      var rows = [];
      var admin = false;
      function paint() {
        list.innerHTML = "";
        var q = fold(search.value.trim());
        var shown = rows.filter(function (r) { return !q || fold(r.title + " " + r.author + " " + r.id).indexOf(q) !== -1; });
        if (!shown.length) { list.appendChild(h("li", null, h("span", { class: "help", text: rows.length ? t("memoNone") : t("libEmpty") }))); return; }
        shown.forEach(function (r) {
          var li = h("li", null,
            h("a", { href: "#code-" + r.id, class: "shared-title", text: r.title }),
            h("span", { class: "help", text: (r.author ? fmt(t("by"), { a: r.author }) + " · " : "") + fmt(t("exCount"), { n: r.n }) }),
            h("span", { class: "chip todo mono", text: r.id }));
          if (admin) li.appendChild(armButton(t("libDelete"), t("libConfirm"), function () {
            db.doc("library/" + r.id).delete().catch(function () { /* the snapshot shows the real state */ });
          }));
          list.appendChild(li);
        });
      }
      search.addEventListener("input", paint);
      body.appendChild(search);
      body.appendChild(list);
      libUnsub = db.collection("library").orderBy("addedAt", "desc").limit(500).onSnapshot(function (snap) {
        rows = snap.docs.map(function (dd) { var x = dd.data() || {}; return { id: dd.id, title: String(x.title || dd.id).slice(0, 120), author: String(x.author || "").slice(0, 60), n: Number(x.n) || 0, hash: x.hash }; });
        paint();
      }, function () { body.appendChild(h("div", { class: "banner bad", text: t("libError") })); });
      Promise.resolve(user ? user.canEdit() : false).then(function (can) {
        admin = !!can;
        paint();
        if (!admin) return;
        var ta = h("textarea", { class: "code-in", rows: "3", spellcheck: "false", placeholder: STANDALONE ? t("openPlaceholderSolo") : t("openPlaceholder"), "aria-label": t("libAddTitle") });
        var msg = h("div", { "aria-live": "polite" });
        var add = btn("btn-primary", null, t("libAddBtn"), function () {
          msg.innerHTML = "";
          add.disabled = true;
          decodeCode(ta.value).then(function (r) {
            var hash = fnv(r.code);
            var dup = rows.filter(function (x) { return x.hash === hash; })[0];
            if (dup) { msg.appendChild(h("div", { class: "banner info", text: fmt(t("libExists"), { c: dup.id }) })); return; }
            var code = newShortCode();
            return db.doc("library/" + code).get().then(function (snap) {
              if (snap.exists) code = newShortCode();
              return db.doc("library/" + code).set({ code: r.code, title: r.doc.title, author: r.doc.author, n: r.doc.exercises.length, hash: hash, addedAt: new Date().toISOString() });
            }).then(function () {
              ta.value = "";
              msg.appendChild(h("div", { class: "banner ok", text: fmt(t("libAdded"), { c: code }) }));
            });
          }).catch(function (e) {
            msg.appendChild(h("div", { class: "banner bad", text: e && e.reason ? codeErrorText(e) : (e && e.code === "quota_exceeded" ? t("libFull") : t("libError")) }));
          }).then(function () { add.disabled = false; });
        });
        body.appendChild(h("section", { class: "exercise" },
          h("div", { class: "ex-head" }, h("span", { class: "ex-kind", text: t("libAddTitle") })),
          h("p", { class: "help", text: t("libAddHelp") }), ta, h("div", null, add), msg));
      });
    });
  }

  /* ================= boot ================= */
  Store.load();
  lang = Store.data.lang || ((navigator.language || "fr").toLowerCase().indexOf("fr") === 0 ? "fr" : (navigator.language || "").toLowerCase().indexOf("en") === 0 ? "en" : "fr");
  document.getElementById("lang-fr").addEventListener("click", function () { setLang("fr"); });
  document.getElementById("lang-en").addEventListener("click", function () { setLang("en"); });
  window.addEventListener("hashchange", function () { route(false); });
  memoEl = document.getElementById("memo");
  document.getElementById("memo-btn").addEventListener("click", function () { if (memoEl.hidden) openMemo(); else closeMemo(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && memoEl && !memoEl.hidden) closeMemo(); });
  setupKeybar();
  renderAll(false);
  Py.start();
  if (STANDALONE && "serviceWorker" in navigator && /^https?:$/.test(window.location.protocol)) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () { /* offline mode is optional */ }); });
  }
  window.__pp = { Py: Py, judge: judge, lessons: LESSONS };
})();

</script>

</body>
</html>
